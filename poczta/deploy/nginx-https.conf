server {
    listen 80;
    listen [::]:80;
    server_name poczta.dimundi.com webmail.dimundi.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://webmail.dimundi.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name poczta.dimundi.com;
    ssl_certificate /etc/letsencrypt/live/poczta.dimundi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poczta.dimundi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://webmail.dimundi.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name webmail.dimundi.com;
    ssl_certificate /etc/letsencrypt/live/poczta.dimundi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poczta.dimundi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 35m;
    location / {
        set $webmail http://dimundi-webmail:80;
        proxy_pass $webmail;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
