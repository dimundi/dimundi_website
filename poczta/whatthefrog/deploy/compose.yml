name: whatthefrog-mail

services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:16.0.1
    hostname: poczta.whatthefrog.pl
    env_file: mailserver.env
    restart: unless-stopped
    stop_grace_period: 1m
    cap_add:
      - NET_ADMIN
    ports:
      - "54.38.134.226:25:25"
      - "54.38.134.226:465:465"
      - "54.38.134.226:587:587"
      - "54.38.134.226:993:993"
    volumes:
      - ../data/mail:/var/mail
      - ../data/state:/var/mail-state
      - ../data/logs:/var/log/mail
      - ../data/config:/tmp/docker-mailserver
      - ./fail2ban-jail.cf:/tmp/docker-mailserver/fail2ban-jail.cf:ro
      - ./ignore-roundcube.sh:/usr/local/bin/ignore-roundcube.sh:ro
      - /home/docker/dimundi/proxy/letsencrypt:/etc/letsencrypt:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      default:
        aliases:
          - poczta.whatthefrog.pl
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  roundcube:
    image: roundcube/roundcubemail:1.6.19-apache
    restart: unless-stopped
    environment:
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://poczta.whatthefrog.pl
      ROUNDCUBEMAIL_DEFAULT_PORT: 993
      ROUNDCUBEMAIL_SMTP_SERVER: tls://poczta.whatthefrog.pl
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload
    volumes:
      - ../data/roundcube-db:/var/roundcube/db
      - ./roundcube.php:/var/roundcube/config/custom.php:ro
    secrets:
      - roundcube_des_key
    depends_on:
      mailserver:
        condition: service_healthy
    networks:
      default:
        aliases:
          - whatthefrog-roundcube
      proxy:
        aliases:
          - whatthefrog-webmail
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

secrets:
  roundcube_des_key:
    file: ../secrets/roundcube_des_key

networks:
  default:
    driver_opts:
      com.docker.network.host_ipv4: '54.38.134.226'
  proxy:
    external: true
    name: dimundi-proxy_default
