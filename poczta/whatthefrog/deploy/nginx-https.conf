# All POSTs are limited: login credentials can be sent in the request body,
# so matching only URL arguments would leave a bypass.
map $request_method $whatthefrog_webmail_post_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $whatthefrog_webmail_post_key zone=whatthefrog_webmail_posts:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name poczta.whatthefrog.pl webmail.whatthefrog.pl;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://webmail.whatthefrog.pl$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name poczta.whatthefrog.pl;
    ssl_certificate /etc/letsencrypt/live/poczta.whatthefrog.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poczta.whatthefrog.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://webmail.whatthefrog.pl$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name webmail.whatthefrog.pl;
    ssl_certificate /etc/letsencrypt/live/poczta.whatthefrog.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poczta.whatthefrog.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 35m;
    limit_req zone=whatthefrog_webmail_posts burst=15 nodelay;
    limit_req_status 429;
    location / {
        set $webmail http://whatthefrog-webmail:80;
        proxy_pass $webmail;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
