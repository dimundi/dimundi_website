<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dimundi logo</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 420px; overflow: hidden; background: transparent; }
    body { display: grid; place-items: center; }
    .brand { display: inline-grid; gap: 15px; }
    .name { color: #1f376b; font: 280px/1 'VT323', monospace; white-space: nowrap; }
    .accent { color: #8fb0ff; }
    .tagline { justify-self: end; color: #506ca8;
      font: 500 57.27px/1.4 'IBM Plex Mono', monospace; letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <div class="brand">
    <div class="name"><span class="accent">di</span>mundi_</div>
    <div class="tagline">CREATIVE IT</div>
  </div>
</body>
</html>
