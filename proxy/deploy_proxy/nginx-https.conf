server {
    listen 80;
    listen [::]:80;
    server_name dimundi.com www.dimundi.com dimundi.pl www.dimundi.pl vps-f9b377ab.vps.ovh.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://dimundi.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.dimundi.com dimundi.pl www.dimundi.pl;
    ssl_certificate /etc/letsencrypt/live/dimundi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dimundi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://dimundi.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dimundi.com;
    ssl_certificate /etc/letsencrypt/live/dimundi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dimundi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $frontend http://dimundi-frontend:80;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
