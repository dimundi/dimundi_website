services:
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile-test
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./proxy/nginx-test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile-test
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile-test
    env_file:
      - ./backend/.env
    environment:
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
