<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Contact Dimundi." />
  <title>Dimundi | Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <main id="page-screen-container" class="screen">
    <section id="terminal-container" class="terminal" aria-labelledby="contact-title">
      <div id="heading">
      <h1 id="contact-title" class="line page-title">
        <!--# include virtual="/partials/home-link.html" -->
        <span class="page-title-text"><span class="typed">Contact form</span><span class="cursor" id="cursor">&#9608;</span></span>
      </h1>
      <p class="page-subtitle">Fill in your data and we'll contact you</p>
      </div>

      <div class="contact-details" aria-label="Contact details">
        <p id="contact-details-status" role="status">Loading contact details…</p>
        <div id="contact-details-values" hidden>
          <p><span class="footer-el">Email:</span> <a data-contact-email></a></p>
          <p><span class="footer-el">Phone:</span> <a data-contact-phone></a></p>
        </div>
      </div>

      <form class="terminal-form" id="contact-form" novalidate hidden>
        <div class="question-list" id="question-list" aria-live="polite"></div>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
      
    </section>
    
  </main>

  <!--# include virtual="/partials/footer.html" -->

  <script src="script.js" defer></script>
  <script src="contact-details.js" defer></script>
  <script src="contact.js" defer></script>
</body>
</html>
