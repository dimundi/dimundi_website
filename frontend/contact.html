<!DOCTYPE html>
<html lang="en">
<head>
  <!--# include virtual="/partials/head.html" -->
  <meta name="description" content="Contact Dimundi to discuss custom software, system integrations, or AI solutions for your business." />
  <title>Contact Dimundi | Discuss Your Project</title>
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <main id="page-screen-container" class="screen">
    <section id="terminal-container" class="terminal" aria-labelledby="contact-title">
      <div id="heading">
      <h1 id="contact-title" class="line page-title">
        <!--# include virtual="/partials/home-link.html" -->
        <span class="page-title-text"><span class="typed">Contact form</span><span class="cursor" id="cursor">&#9608;</span></span>
      </h1>
      <p class="page-subtitle">Fill in your data and we'll contact you</p>
      </div>

      <div class="contact-details" aria-label="Contact details">
        <p id="contact-details-status" role="status">Loading contact details…</p>
        <div id="contact-details-values" hidden>
          <p><span class="footer-el">Email:</span> <a data-contact-email></a></p>
          <p><span class="footer-el">Phone:</span> <a data-contact-phone></a></p>
        </div>
      </div>

      <form class="terminal-form" id="contact-form" novalidate>
        <fieldset class="contact-fields" id="contact-fields">
          <legend>Send us a message</legend>
          <div class="contact-field">
            <label for="contact-name">Name</label>
            <input id="contact-name" name="name" type="text" autocomplete="name" maxlength="80" required />
          </div>
          <div class="contact-field">
            <label for="contact-email">Your Email</label>
            <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required />
          </div>
          <div class="contact-field contact-field-message">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="6" maxlength="2000" required></textarea>
          </div>
          <button class="contact-submit" type="submit">Send message</button>
        </fieldset>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
      
    </section>
    
  </main>

  <!--# include virtual="/partials/footer.html" -->

  <script src="script.js" defer></script>
  <script src="contact-details.js" defer></script>
  <script src="contact.js" defer></script>
</body>
</html>
