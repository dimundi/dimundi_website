name: dimundi-app

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile-frontend
    restart: unless-stopped
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
      proxy:
        aliases:
          - dimundi-frontend

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ./backend.env
      - ../backend/.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  proxy:
    external: true
    name: dimundi-proxy_default
