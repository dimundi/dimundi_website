server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    # Keep redirects relative behind the HTTP/HTTPS reverse proxy.
    absolute_redirect off;

    location = / {
        ssi on;
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 /$is_args$args;
    }

    location ~ ^/services(?:\.html|/)?$ {
        return 301 /solutions$is_args$args;
    }

    location = /solutions {
        default_type text/html;
        ssi on;
        try_files /services.html =404;
    }

    location ~ ^/(about|solutions|contact|snake)(?:\.html|/)$ {
        return 301 /$1$is_args$args;
    }

    location ~ ^/(about|contact|snake)$ {
        default_type text/html;
        ssi on;
        try_files $uri.html =404;
    }


    location = /404.html {
        internal;
        ssi on;
    }
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~ (^/\.|/Dockerfile|/nginx\.conf$) {
        return 404;
    }

    location / {
        ssi on;
        try_files $uri $uri/ =404;
    }
}
